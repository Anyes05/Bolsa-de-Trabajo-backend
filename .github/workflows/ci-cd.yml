name: ci-cd

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: backend-ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: backend
  RDS_HOST: database-1.cucoc3zl6r3t.us-east-1.rds.amazonaws.com
  RDS_DB: ccisj_database
  EC2_HOST: 44.218.41.4
  EC2_SECURITY_GROUP_ID: sg-07b88f147aef90a12

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify with Maven
        run: mvn --batch-mode clean verify

  migrate:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Allow SSH from this runner
        id: sg
        run: |
          RUNNER_IP="$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')"
          echo "runner_ip=${RUNNER_IP}" >> "$GITHUB_OUTPUT"
          aws ec2 authorize-security-group-ingress \
            --group-id "${EC2_SECURITY_GROUP_ID}" \
            --protocol tcp \
            --port 22 \
            --cidr "${RUNNER_IP}/32" || true
          sleep 5
      - name: Open SSH tunnel to RDS
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/ccisj.pem
          chmod 600 ~/.ssh/ccisj.pem
          ssh-keyscan -H "${EC2_HOST}" >> ~/.ssh/known_hosts
          ssh -f -N -L "5433:${RDS_HOST}:5432" \
            -i ~/.ssh/ccisj.pem \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=15 \
            "ec2-user@${EC2_HOST}"
      - name: Flyway migrate
        env:
          FLYWAY_USER: ${{ secrets.DATABASE_USERNAME }}
          FLYWAY_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        run: |
          mvn --batch-mode flyway:migrate \
            "-Dflyway.url=jdbc:postgresql://127.0.0.1:5433/${RDS_DB}?sslmode=require" \
            "-Dflyway.user=${FLYWAY_USER}" \
            "-Dflyway.password=${FLYWAY_PASSWORD}" \
            -Dflyway.connectRetries=10 \
            -Dflyway.baselineOnMigrate=true \
            -Dflyway.baselineVersion=1
      - name: Remove runner SSH access
        if: always()
        run: |
          if [ -n "${{ steps.sg.outputs.runner_ip }}" ]; then
            aws ec2 revoke-security-group-ingress \
              --group-id "${EC2_SECURITY_GROUP_ID}" \
              --protocol tcp \
              --port 22 \
              --cidr "${{ steps.sg.outputs.runner_ip }}/32" || true
          fi

  deploy:
    needs: [test, migrate]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - id: vars
        run: |
          IMAGE_SHA_TAG="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:sha-${GITHUB_SHA}"
          echo "image_sha_tag=${IMAGE_SHA_TAG}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.image_sha_tag }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
      - name: Allow SSH from this runner
        id: sg
        run: |
          RUNNER_IP="$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')"
          echo "runner_ip=${RUNNER_IP}" >> "$GITHUB_OUTPUT"
          aws ec2 authorize-security-group-ingress \
            --group-id "${EC2_SECURITY_GROUP_ID}" \
            --protocol tcp \
            --port 22 \
            --cidr "${RUNNER_IP}/32" || true
      - name: Deploy backend image in EC2
        env:
          IMAGE_SHA_TAG: ${{ steps.vars.outputs.image_sha_tag }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/ccisj.pem
          chmod 600 ~/.ssh/ccisj.pem
          ssh-keyscan -H "${EC2_HOST}" >> ~/.ssh/known_hosts

          for attempt in 1 2 3 4 5 6; do
            if ssh -i ~/.ssh/ccisj.pem "ec2-user@${EC2_HOST}" \
              "IMAGE_SHA_TAG='${IMAGE_SHA_TAG}' AWS_ACCESS_KEY_ID='${AWS_ACCESS_KEY_ID}' AWS_SECRET_ACCESS_KEY='${AWS_SECRET_ACCESS_KEY}' AWS_SESSION_TOKEN='${AWS_SESSION_TOKEN}' AWS_REGION='${AWS_REGION}' bash -s" <<'EOF'
          set -euo pipefail

          ECR_REGISTRY="${IMAGE_SHA_TAG%%/*}"
          aws ecr get-login-password --region "${AWS_REGION}" | sudo docker login --username AWS --password-stdin "${ECR_REGISTRY}"

          sudo sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=${IMAGE_SHA_TAG}|" /opt/ccisj/runtime.env
          sudo docker compose --env-file /opt/ccisj/runtime.env -f /opt/ccisj/docker-compose.prod.yml pull backend
          sudo docker compose --env-file /opt/ccisj/runtime.env -f /opt/ccisj/docker-compose.prod.yml up -d backend
          sudo docker compose --env-file /opt/ccisj/runtime.env -f /opt/ccisj/docker-compose.prod.yml ps backend

          for i in $(seq 1 60); do
            if curl -fsS --connect-timeout 2 --max-time 4 http://127.0.0.1:8080/api/actuator/health >/dev/null; then
              echo "Backend healthy"
              exit 0
            fi
            sleep 3
          done

          echo "Backend health no respondió a tiempo"
          sudo docker compose --env-file /opt/ccisj/runtime.env -f /opt/ccisj/docker-compose.prod.yml ps backend || true
          sudo docker logs --tail 300 ccisj-backend-1 || true
          exit 1
          EOF
            then
              exit 0
            fi

            if [ "$attempt" -lt 6 ]; then
              echo "Deploy remoto falló en intento ${attempt}, reintentando en 10s..."
              sleep 10
            fi
          done

          echo "No se pudo completar el deploy remoto tras varios intentos"
          exit 1
      - name: Remove runner SSH access
        if: always()
        run: |
          if [ -n "${{ steps.sg.outputs.runner_ip }}" ]; then
            aws ec2 revoke-security-group-ingress \
              --group-id "${EC2_SECURITY_GROUP_ID}" \
              --protocol tcp \
              --port 22 \
              --cidr "${{ steps.sg.outputs.runner_ip }}/32" || true
          fi