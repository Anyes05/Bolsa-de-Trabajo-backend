name: ci-cd

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: backend
  RDS_HOST: database-1.cucoc3zl6r3t.us-east-1.rds.amazonaws.com
  RDS_DB: ccisj_database
  EC2_HOST: 44.218.41.4
  EC2_SECURITY_GROUP_ID: sg-07b88f147aef90a12

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify with Maven
        run: mvn --batch-mode clean verify

  migrate:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Allow SSH from this runner
        id: sg
        run: |
          RUNNER_IP="$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')"
          echo "runner_ip=${RUNNER_IP}" >> "$GITHUB_OUTPUT"
          aws ec2 authorize-security-group-ingress \
            --group-id "${EC2_SECURITY_GROUP_ID}" \
            --protocol tcp \
            --port 22 \
            --cidr "${RUNNER_IP}/32" || true
          sleep 5
      - name: Open SSH tunnel to RDS
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/ccisj.pem
          chmod 600 ~/.ssh/ccisj.pem
          ssh-keyscan -H "${EC2_HOST}" >> ~/.ssh/known_hosts
          ssh -f -N -L "5433:${RDS_HOST}:5432" \
            -i ~/.ssh/ccisj.pem \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=15 \
            "ec2-user@${EC2_HOST}"
      - name: Flyway migrate
        env:
          FLYWAY_USER: ${{ secrets.DATABASE_USERNAME }}
          FLYWAY_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        run: |
          mvn --batch-mode flyway:migrate \
            "-Dflyway.url=jdbc:postgresql://127.0.0.1:5433/${RDS_DB}?sslmode=require" \
            "-Dflyway.user=${FLYWAY_USER}" \
            "-Dflyway.password=${FLYWAY_PASSWORD}" \
            -Dflyway.connectRetries=10
      - name: Remove runner SSH access
        if: always()
        run: |
          if [ -n "${{ steps.sg.outputs.runner_ip }}" ]; then
            aws ec2 revoke-security-group-ingress \
              --group-id "${EC2_SECURITY_GROUP_ID}" \
              --protocol tcp \
              --port 22 \
              --cidr "${{ steps.sg.outputs.runner_ip }}/32" || true
          fi

  deploy:
    needs: [test, migrate]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}