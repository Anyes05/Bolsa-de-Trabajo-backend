spring:
  application:
    name: ccisj-api
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:12MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:12MB}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    member-email: ${BOOTSTRAP_MEMBER_EMAIL:}
    member-bps: ${BOOTSTRAP_MEMBER_BPS:}
    member-password: ${BOOTSTRAP_MEMBER_PASSWORD:}
  storage:
    bucket: ${S3_BUCKET:}
    region: ${AWS_REGION:us-east-1}
    max-file-size-mb: ${S3_MAX_FILE_SIZE_MB:10}
    max-cvs-per-postulante: ${S3_MAX_CVS_PER_POSTULANTE:5}
    allowed-mime: ${S3_ALLOWED_MIME:application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document}
    presigned-minutes: ${S3_PRESIGNED_MINUTES:15}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true